name: NorthStar Connect Windows Client

on:
  push:
    branches: [main]
    paths:
      - "windows-client/**"
      - "web/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows-client/**"
      - "web/**"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-client:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript tooling
        working-directory: windows-client
        run: npm install

      - name: Build Windows installer and app
        working-directory: windows-client
        run: npm run build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-Connect-Windows-v0.6.1
          path: |
            windows-client/src-tauri/target/release/bundle/nsis/*.exe
            windows-client/src-tauri/target/release/northstar-connect.exe
          if-no-files-found: error
          retention-days: 30
